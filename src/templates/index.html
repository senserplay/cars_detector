<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Upload</title>
    <script>
        // Функция для валидации координат
        function validatePoints(points) {
            return points.every(point => point.length === 2 && !isNaN(point[0]) && !isNaN(point[1]));
        }

        // Функция для отправки данных
        async function sendData() {
            // Получаем видеофайл
            const videoFile = document.getElementById("video_file").files[0];
            if (!videoFile) {
                alert("Пожалуйста, выберите видеофайл.");
                return;
            }

            // Собираем координаты для каждого региона
            const regions = {};

            // Обрабатываем Region 1
            const region1Input = document.getElementById('region1_points').value;
            const region1Points = region1Input.split(';').map(point => {
                const coords = point.split(',').map(Number);
                return [coords[0], coords[1]]; // Сохраняем как массив [x, y]
            }).filter(point => point.length === 2 && !isNaN(point[0]) && !isNaN(point[1]));

            if (!validatePoints(region1Points)) {
                alert("Некорректные данные для Region 1. Убедитесь, что координаты введены в формате 'x,y; x,y; ...'.");
                return;
            }

            // Добавляем Region 1 в regions
            regions["region1"] = {
                points: region1Points // Ключ "points" с координатами
            };

            // Обрабатываем Region 2
            const region2Input = document.getElementById('region2_points').value;
            const region2Points = region2Input.split(';').map(point => {
                const coords = point.split(',').map(Number);
                return [coords[0], coords[1]]; // Сохраняем как массив [x, y]
            }).filter(point => point.length === 2 && !isNaN(point[0]) && !isNaN(point[1]));

            if (!validatePoints(region2Points)) {
                alert("Некорректные данные для Region 2. Убедитесь, что координаты введены в формате 'x,y; x,y; ...'.");
                return;
            }

            // Добавляем Region 2 в regions
            regions["region2"] = {
                points: region2Points // Ключ "points" с координатами
            };

            // Получаем имя устройства
            const deviceName = document.getElementById("device_name").value;
            if (!deviceName) {
                alert("Пожалуйста, введите имя устройства.");
                return;
            }

            // Собираем данные в JSON
            const data = {
                file_name: videoFile.name,
                regions: regions, // Отправляем регионы в нужном формате
                device_name: deviceName,
                headless_mode: document.getElementById("headless_mode").checked
            };

            // Создаем FormData
            const formData = new FormData();
            formData.append("file", videoFile); // Добавляем файл
            formData.append("data", JSON.stringify(data)); // Добавляем JSON как строку

            // Отправляем данные на сервер
            try {
                const response = await fetch('http://127.0.0.1:8000/uploadfile', {
                    method: 'POST',
                    body: formData, // Отправляем FormData
                    // Заголовок Content-Type будет установлен автоматически
                });

                if (response.ok) {
                    const result = await response.json();
                    console.log(result);
                    alert('Данные успешно отправлены! Ответ сервера: ' + JSON.stringify(result));
                } else {
                    const errorResponse = await response.json(); // Читаем тело ошибки
                    console.error('Ошибка:', errorResponse);
                    alert('Ошибка при отправке данных: ' + errorResponse.detail);
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Произошла ошибка при отправке данных.');
            }
        }
    </script>
</head>
<body>
    <h1>Upload Video Data</h1>

    <!-- Поле для загрузки видео -->
    <label for="video_file">Upload Video (MP4):</label>
    <input type="file" id="video_file" accept=".mp4"><br>

    <!-- Поля для Region 1 -->
    <h2>Region 1</h2>
    <label for="region1_points">Enter Points (format: x,y; x,y; ...):</label><br>
    <textarea id="region1_points" rows="4" cols="50" placeholder="Введите точки через запятую и разделяйте точки с помощью ';'"></textarea><br>

    <!-- Поля для Region 2 -->
    <h2>Region 2</h2>
    <label for="region2_points">Enter Points (format: x,y; x,y; ...):</label><br>
    <textarea id="region2_points" rows="4" cols="50" placeholder="Введите точки через запятую и разделяйте точки с помощью ';'"></textarea><br>

    <!-- Поле для имени устройства -->
    <h2>Device Name</h2>
    <label for="device_name">Device Name:</label>
    <input type="text" id="device_name" value="cpu"><br>

    <!-- Чекбокс для headless mode -->
    <h2>Headless Mode</h2>
    <label for="headless_mode">Headless Mode:</label>
    <input type="checkbox" id="headless_mode"><br>

    <!-- Кнопка для отправки данных -->
    <button onclick="sendData()">Send Data</button>
</body>
</html>
